{{- /* renovate: datasource=github-releases depName=anomalyco/opencode */}}
{{- $opencode := "v2.3.0" }}
{{- /* renovate: datasource=github-releases depName=cli/cli */}}
{{- $gh := "v2.103.3" }}

[".local/bin/opencode"]
type = "archive-file"
url = "https://github.com/anomalyco/opencode/releases/download/{{ $opencode }}/opencode-linux-x64.tar.gz"
path = "opencode"
executable = true

[".local/bin/gh"]
type = "archive-file"
url = "https://github.com/cli/cli/releases/download/{{ $gh }}/gh_{{ trimPrefix "v" $gh }}_linux_amd64.tar.gz"
path = "gh_{{ trimPrefix "v" $gh }}_linux_amd64/bin/gh"
executable = true
