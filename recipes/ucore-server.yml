---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
# image will be published to ghcr.io/<user>/<name>
name: ucore-server
# description will be included in the image's metadata
description: This is my personal OS image.

# the base image to build on top of (FROM) and the version tag to use
base-image: ghcr.io/ublue-os/ucore-minimal
image-version: stable-nvidia # latest is also supported if you want new updates ASAP

modules:
  # Fedora 45 (FCOS 45) images are bootc/composefs based and no longer carry
  # the ostree deployment metadata that `rpm-ostree install` needs at build
  # time, so packages are added with dnf instead.
  - type: dnf
    install:
      packages:
        # Incus is packaged in Fedora proper since F43; the ganto/lxc4 COPR
        # is no longer required.
        - incus

  - type: files
    files:
      - source: system
        destination: / # copies files/system/* (* means everything inside it) into your image's root folder /
