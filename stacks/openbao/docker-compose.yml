name: openbao

services:
  openbao:
    container_name: openbao
    build:
      context: .
      dockerfile: Dockerfile.openbao
    image: local/openbao:2.7.1
    command: ["server"]
    restart: unless-stopped
    security_opt:
      - label=disable
    environment:
      BAO_API_ADDR: https://bao.${DOMAIN_NAME}
    secrets:
      - openbao_static_seal_key
    volumes:
      - openbao-data:/openbao/data
      - ./openbao.hcl:/openbao/config/openbao.hcl:ro
      - ./policies:/openbao/policies:ro
    ports:
      - 127.0.0.1:18200:8200
    cap_add:
      - IPC_LOCK
    healthcheck:
      test: ["CMD-SHELL", "BAO_ADDR=http://127.0.0.1:8200 bao status"]
      interval: 5s
      timeout: 3s
      retries: 30
    networks:
      - backend
      - proxy
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.openbao.rule=Host(`bao.${DOMAIN_NAME}`)
      - traefik.http.routers.openbao.entrypoints=websecure
      - traefik.http.routers.openbao.tls=true
      - traefik.http.routers.openbao.tls.certresolver=letsencrypt
      - traefik.http.routers.openbao.service=openbao
      - traefik.http.services.openbao.loadbalancer.server.port=8200

  bao:
    image: ${BAO_CLIENT_IMAGE:-quay.io/openbao/openbao:2.7.1}
    entrypoint: ["bao"]
    user: "0"
    environment:
      BAO_ADDR: http://openbao:8200
    security_opt:
      - label=disable
    volumes:
      - ./policies:/policies:ro
    secrets:
      - source: github_app_private_key
        target: github-app-private-key.pem
      - admin_password
      - approver_password
    networks:
      - backend
    profiles:
      - tools

  authorizer:
    image: ${AUTHORIZER_IMAGE:-ghcr.io/xtruder/openbao-authorizer:v1.0.0-rc.1}
    command: ["-config", "/etc/openbao-authorizer/authorizer.hcl"]
    restart: unless-stopped
    security_opt:
      - label=disable
    environment:
      DOMAIN_NAME: ${DOMAIN_NAME}
      VAPID_SUBJECT: ${VAPID_SUBJECT}
    depends_on:
      openbao:
        condition: service_healthy
    volumes:
      - app-data:/var/lib/openbao-authorizer
      - ./authorizer.hcl:/etc/openbao-authorizer/authorizer.hcl:ro
    secrets:
      - openbao_authorizer_token
      - authorizer_encryption_key
      - vapid_public_key
      - vapid_private_key
    ports:
      - 127.0.0.1:18202:8080
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.openbao-authorizer.rule=Host(`baoauthz.${DOMAIN_NAME}`)
      - traefik.http.routers.openbao-authorizer.entrypoints=websecure
      - traefik.http.routers.openbao-authorizer.tls=true
      - traefik.http.routers.openbao-authorizer.tls.certresolver=letsencrypt
      - traefik.http.services.openbao-authorizer.loadbalancer.server.port=8080
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks:
      - backend
      - proxy

secrets:
  github_app_private_key:
    external: true
  admin_password:
    external: true
  approver_password:
    external: true
  openbao_static_seal_key:
    external: true
  openbao_authorizer_token:
    external: true
  authorizer_encryption_key:
    external: true
  vapid_public_key:
    external: true
  vapid_private_key:
    external: true

volumes:
  openbao-data:
    name: openbao-data
  app-data:
    name: openbao-app-data

networks:
  backend:
    internal: true
  proxy:
    name: proxy
    external: true
